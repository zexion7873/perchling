name: codeql

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          # Default setup's autobuild needs an Xcode project or Package.swift; this repo has neither.
          - language: swift
            os: macos-15
            build-mode: manual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: toolchain
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: build what ships
        if: matrix.build-mode == 'manual'
        run: swiftc -O plugin/scripts/pet.swift -o "$RUNNER_TEMP/perchling"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
      - name: trial — what was extracted and found
        if: always()
        run: |
          for f in ../results/*.sarif; do
            [ -f "$f" ] || continue
            echo "$f"
            jq -r '.runs[] | "results: \(.results|length)", (.tool.driver.notifications // [] | .[] | .id), (.invocations[]?.toolExecutionNotifications[]? | "\(.descriptor.id): \(.message.text)")' "$f" | sort | uniq -c | head -40
          done
