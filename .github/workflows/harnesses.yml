name: harnesses

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

# This repo IS the marketplace users install from, so the token's scope is a
# property of this file rather than a repo-settings toggle.
permissions:
  contents: read

concurrency:
  # event_name is part of the key: schedule and push used to share
  # harnesses-refs/heads/main, and the daily cron — which runs only the hooks
  # job — would cancel an in-flight push run and leave the pushed commit grey,
  # never re-tested, on the branch subscribers pull.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harnesses:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: toolchain
        run: swiftc --version
      - name: every harness
        run: |
          set -euo pipefail
          fail=0
          for f in tools/run-*.sh; do
            [ "$f" = tools/run-hooks-check.sh ] && continue
            [ "$f" = tools/run-mutation-gate.sh ] && continue
            echo "::group::$f"
            if ! bash "$f"; then echo "::error::$f failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit "$fail"
      - name: every example validates
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/verify"
          mkdir -p "$W/home"
          cp "examples/${PERCHLING_BUILTIN:-husky}.json" "$W/home/builtin.json"
          swiftc -O scripts/pet.swift -o "$W/perchling"
          export PERCHLING_HOME="$W/home" PERCHLING_EXAMPLES="$PWD/examples"
          for f in examples/*.json; do "$W/perchling" --validate "$f" > /dev/null; done
      - name: export round-trips byte-identical
        # No size gate: the description's size claim was deleted rather than
        # guarded. The size is still printed so a surprise jump is visible in
        # the log, but nothing fails on it — a claim and its check go together,
        # and there is no claim.
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/verify"
          export PERCHLING_HOME="$W/home" PERCHLING_EXAMPLES="$PWD/examples"
          "$W/perchling" --export | cmp - "examples/${PERCHLING_BUILTIN:-husky}.json"
          echo "binary: $(stat -f%z "$W/perchling") bytes"
      - name: the README hero regenerates and round-trips
        # The tool decodes its own output back pixel-for-pixel and gates the
        # colour drift before it will exit 0. docs/moods.gif is deliberately
        # NOT diffed against the committed one: byte-identity is proven per
        # machine, and a runner's colour management is not this machine's.
        run: bash tools/make-moods-gif.sh "$RUNNER_TEMP/hero.gif"
      - name: nothing leaked into the real runtime home
        # AGENTS.md forbids tests from touching ~/.claude/perchling in three
        # separate places; this is the first thing that checks it.
        run: test ! -e "$HOME/.claude/perchling"

  mutation-gate:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The gate must not be allowed to mistake a machine that cannot compile
      # for a machine that caught ten mutants: with no toolchain, every Swift
      # harness dies in preflight, and dying is indistinguishable from red
      # without this step failing first.
      - name: toolchain
        run: swiftc --version
      - name: every harness goes red against the defect it is named after
        run: bash tools/run-mutation-gate.sh

  hooks:
    # Also on the daily schedule: this one validates against an EXTERNAL moving
    # target — the installed CLI — and a CLI release that voids every hook in
    # hooks.json is invisible to a PR-only trigger, because nobody pushed.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: hooks.json declares no event this CLI rejects
        run: bash tools/run-hooks-check.sh
