name: Bug report
description: The pet did something wrong, or did nothing when it should have
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Two things decide whether a report is actionable here, and both are easy
        to check before you write anything:

        - **`pet.sh status`** — says whether the binary, the process and the
          session refcounts are what you think they are. Resolve the script
          rather than guessing a path; the field below carries the one-liner.
        - **`claude plugin list`** — the version that actually reached you. An update
          only lands on sessions started *after* it, so a fix you read about may
          not be the one running.

  - type: input
    id: version
    attributes:
      label: perchling version
      description: "`claude plugin list` — the line for `perchling@perchling`. Not the version on `main`: a plugin update only reaches sessions started after it."
      placeholder: "1.21.2"
    validations:
      required: true

  - type: input
    id: cli
    attributes:
      label: Claude Code version
      description: "`claude --version`. A CLI that does not recognise one of the hook events this plugin declares drops hooks silently — on older ones, every hook in the file — so \"no pet, no error\" can be a version answer rather than a bug."
      placeholder: "2.1.259"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where were you running Claude Code?
      description: This is the single most useful field. The desktop app and the terminal CLI dispatch different hook events, and at least one confirmed bug exists only in one of them.
      options:
        - Terminal CLI
        - Desktop app (Mac)
        - VS Code / JetBrains extension
        - Claude Code on the web
        - More than one, and it differs between them
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "`sw_vers -productVersion`. The overlay is AppKit and some of it is version-sensitive."
      placeholder: "26.5"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
      description: The mood it showed versus the mood it should have shown, and what you were doing at the time.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to make it happen again
      description: If you cannot reproduce it, say so — an intermittent report with real timestamps beats a confident guess.
      placeholder: |
        1. Start a session in …
        2. Run a tool that …
        3. The pet stays on `running` for the whole prompt

  - type: textarea
    id: status
    attributes:
      label: Output of pet.sh status
      description: |
        Pasted as-is — it is one of the few things in a report that cannot be misremembered. Resolve the script out of `plugins/cache` and take the highest version; a `plugins` search also reaches the marketplace clone, which tracks `main` rather than what you have installed, and reports the wrong thing.

        ```bash
        bash "$(find "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/plugins/cache" -type f -path '*perchling*/scripts/pet.sh' 2>/dev/null | sort -V | tail -1)" status
        ```
      render: text

  - type: textarea
    id: manifest
    attributes:
      label: If a custom pet is involved, what validate says about it
      description: "`~/.claude/perchling/bin/perchling --validate <path>`. With no path it reports the active pet."
      render: text

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I have read the version I am running, not the version on main.
          required: true
        - label: This is about the pet's behaviour, not about Claude Code itself.
          required: true
